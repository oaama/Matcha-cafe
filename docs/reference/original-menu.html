<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>منيو ماتشا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: customer menu is a single phone-first column; staff screens are wide boards with a slim demo switcher on top */
:root{
  --bg:#F6F4EC; --surface:#FFFFFF; --surface2:#EFEEE4; --ink:#2A2B22; --muted:#6C6D5C; --line:#E2E0D2;
  --matcha:#6E8A3C; --matcha-ink:#FFFFFF; --matcha-soft:#E5EBD4; --bean:#6B4A2E; --honey:#C48F30;
  --ok:#3F7A3A; --warn:#B07A1E; --bad:#B0442F; --bad-soft:#F6E1DA; --warn-soft:#F5ECD7; --ok-soft:#E1EEDC;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141611; --surface:#1D2019; --surface2:#262A21; --ink:#ECEBE1; --muted:#A3A38F; --line:#33372C;
  --matcha:#A3BD6B; --matcha-ink:#1A1D14; --matcha-soft:#2B3421; --bean:#D7AE86; --honey:#E3B964;
  --ok:#86C27A; --warn:#E2B460; --bad:#E7826B; --bad-soft:#3A221C; --warn-soft:#382D18; --ok-soft:#203321; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141611; --surface:#1D2019; --surface2:#262A21; --ink:#ECEBE1; --muted:#A3A38F; --line:#33372C;
  --matcha:#A3BD6B; --matcha-ink:#1A1D14; --matcha-soft:#2B3421; --bean:#D7AE86; --honey:#E3B964;
  --ok:#86C27A; --warn:#E2B460; --bad:#E7826B; --bad-soft:#3A221C; --warn-soft:#382D18; --ok-soft:#203321; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--matcha);outline-offset:2px}
.num,.price{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
body.lock{overflow:hidden}

/* demo switcher */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bean);color:#FBF6EE;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 16px;font-size:13px}
.demo b{font-weight:600;margin-inline-end:4px}
.demo .tabs{display:flex;gap:4px;flex-wrap:wrap}
.demo button{background:transparent;border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:999px;padding:3px 11px}
.demo button.on{background:#FBF6EE;color:#3B2716;border-color:#FBF6EE}
.demo button:disabled{opacity:.35;cursor:not-allowed}
.demo select{background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px 8px;color:inherit}
.demo select option{color:#222}
.demo .sp{flex:1}

/* customer */
.cust{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);object-fit:cover}
.brand h1{font-size:26px;letter-spacing:.06em;font-weight:600;line-height:1}
.brand .tag{margin:4px 0 0;font-size:10.5px;letter-spacing:.32em;color:var(--muted)}
.head-actions{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px}
.ibtn svg{width:19px;height:19px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;background:var(--matcha-soft);color:var(--ink);border:0}
.pill.track{background:var(--bean);color:#FBF6EE}
.searchbar{margin-top:14px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.searchbar svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbar input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 34px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--matcha);color:var(--matcha-ink);border-color:var(--matcha)}
.chip.sep{margin-inline-start:6px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:21px;font-weight:600;color:var(--matcha)}
.sec-h span{color:var(--muted);font-size:13px}
.prod{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;position:relative}
.prod.off{opacity:.55}
.prod.off .thumb{filter:grayscale(1)}
.thumb{width:76px;height:76px;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 45% 88%),hsl(var(--h) 38% 76%));color:hsl(var(--h) 40% 30%)}
.thumb svg{width:38px;height:38px}
.thumb img{width:100%;height:100%;object-fit:cover}
.pinfo{min-width:0}
.pname{font-family:var(--display);font-weight:500;font-size:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pdesc{margin:2px 0 4px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pprice{font-weight:600;font-size:15px}
.pprice s{color:var(--muted);font-weight:400;font-size:13px;margin-inline-start:6px}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;line-height:1.6;font-family:var(--body)}
.b-best{background:var(--warn-soft);color:var(--warn)}
.b-new{background:var(--bad-soft);color:var(--bad)}
.b-offer{background:var(--ok-soft);color:var(--ok)}
.b-off{background:var(--surface2);color:var(--muted)}
.pside{display:flex;flex-direction:column;align-items:center;gap:6px}
.fav{border:0;background:transparent;color:var(--muted);padding:4px;line-height:0}
.fav.on{color:var(--bad)}
.fav svg{width:20px;height:20px}
.addbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--matcha);color:var(--matcha-ink);display:grid;place-items:center}
.addbtn svg{width:18px;height:18px}
.addbtn:disabled{background:var(--surface2);color:var(--muted)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.c-foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;color:var(--muted);font-size:13.5px}
.c-foot .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--matcha);color:var(--matcha-ink);border-color:var(--matcha);font-weight:600}
.btn.dark{background:var(--bean);color:#FBF6EE;border-color:var(--bean)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;padding:13px}
.cartbar{position:fixed;inset-inline:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;max-width:688px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bean);color:#FBF6EE;border:0;border-radius:16px;padding:14px 18px;font-family:var(--display);font-size:15.5px;box-shadow:0 10px 30px rgba(40,30,15,.25)}
.cartbar .cnt{background:#FBF6EE;color:var(--bean);border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;padding:0 6px}
.consent{margin-top:12px;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.consent p{margin:0;flex:1;min-width:200px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(20,18,10,.45)}
.sheet{position:absolute;inset-inline:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet.wide{max-width:860px}
@media (min-width:760px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.sh-top h2{font-size:21px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.hero-tile{height:150px;border-radius:16px;display:grid;place-items:center;overflow:hidden;margin-bottom:12px;background:linear-gradient(150deg,hsl(var(--h) 45% 88%),hsl(var(--h) 38% 72%));color:hsl(var(--h) 40% 28%)}
.hero-tile svg{width:70px;height:70px}
.hero-tile img{width:100%;height:100%;object-fit:cover}
.grp{margin-top:16px}
.grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.grp-h b{font-family:var(--display);font-weight:500}
.req{font-size:11.5px;border-radius:6px;padding:1px 8px;background:var(--bad-soft);color:var(--bad)}
.req.okk{background:var(--ok-soft);color:var(--ok)}
.req.opt{background:var(--surface2);color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px}
.opt.on{border-color:var(--matcha);background:var(--matcha-soft);box-shadow:inset 0 0 0 1px var(--matcha)}
.opt small{color:var(--muted);margin-inline-start:4px}
textarea,input[type=text],input[type=tel],input[type=number],input[type=time],input[type=url],select.f{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px}
textarea{min-height:64px;resize:vertical}
label.fl{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.stepper{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center}
.stepper button svg{width:15px;height:15px}
.stepper span{min-width:26px;text-align:center;font-weight:600}
.sh-bottom{display:flex;gap:10px;align-items:center;margin-top:18px;position:sticky;bottom:-18px;background:var(--bg);padding-block:10px}
.sh-bottom .btn{flex:1;padding:13px}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sugg button{flex:none;width:128px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:start}
.sugg .thumb{width:100%;height:60px;margin-bottom:6px}
.sugg .thumb svg{width:28px}
.sugg b{display:block;font-weight:500;font-size:13px;line-height:1.3}
.sugg span{font-size:12.5px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .lo{font-size:12.5px;color:var(--muted)}
.line .lr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg button:disabled{opacity:.4}
.sum{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sum .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:16px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.note{color:var(--muted);font-size:12.5px;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.radio label.dis{opacity:.5}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0}
.steps div{text-align:center;font-size:12.5px;color:var(--muted)}
.steps div i{display:block;height:6px;border-radius:3px;background:var(--surface2);margin-bottom:6px}
.steps div.on{color:var(--ink);font-weight:600}
.steps div.on i{background:var(--matcha)}
.bigno{font-family:var(--display);font-size:34px;font-weight:600;color:var(--matcha)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:28px;color:var(--line);padding:0;line-height:1}
.stars button.on{color:var(--honey)}
.ticket{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;padding:14px;white-space:pre-wrap;direction:rtl}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw}

/* staff */
.staff{padding-inline:16px;padding-block:16px 40px;max-width:1400px;margin:0 auto}
.st-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.st-head h1{font-size:22px;font-weight:600}
.st-head .sp{flex:1}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col{background:var(--surface2);border-radius:14px;padding:10px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px;font-family:var(--display);font-weight:600}
.col-h .num{background:var(--surface);border-radius:999px;padding:0 10px;font-size:13px}
.kcard{background:var(--surface);border-radius:12px;padding:12px;margin-bottom:10px;border-inline-start:5px solid var(--matcha);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kcard.late{border-inline-start-color:var(--warn)}
.kcard.very{border-inline-start-color:var(--bad)}
.kcard.fresh{animation:flash 1.2s ease-out 2}
@keyframes flash{50%{background:var(--warn-soft)}}
.k-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.k-no{font-family:var(--display);font-weight:700;font-size:20px}
.k-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.k-meta{font-size:13px;color:var(--muted);margin:2px 0 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.k-items{list-style:none;margin:0;padding:0;border-top:1px dashed var(--line)}
.k-items li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.k-items li.dim{opacity:.4}
.k-items .q{font-weight:700;margin-inline-end:6px}
.k-items .o{display:block;color:var(--muted);font-size:12.5px}
.k-items .n{display:block;color:var(--bad);font-size:12.5px;font-weight:600}
.st-tag{font-size:11px;border-radius:5px;padding:0 6px;background:var(--surface2);color:var(--muted);margin-inline-start:6px}
.k-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.k-act .btn{flex:1}
.svc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.svc .item svg{width:22px;height:22px;flex:none;color:var(--warn)}
.svc .item{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:8px 12px;font-size:14px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface2)}
td input,td select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;width:auto}
td input[type=number]{width:84px}
.st{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;font-weight:600}
.st-new{background:var(--bad-soft);color:var(--bad)}
.st-prep{background:var(--warn-soft);color:var(--warn)}
.st-ready{background:var(--ok-soft);color:var(--ok)}
.st-done{background:var(--surface2);color:var(--muted)}
.st-cancelled{background:var(--surface2);color:var(--bad);text-decoration:line-through}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted)}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--matcha);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h3{font-size:16px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .sp{flex:1}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.prow .thumb{width:48px;height:48px;border-radius:10px}
.prow .thumb svg{width:24px;height:24px}
.prow .nm{font-weight:500}
.prow .sub{font-size:12.5px;color:var(--muted)}
.sw{position:relative;width:42px;height:24px;border-radius:999px;border:0;background:var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.sw.on{background:var(--matcha)}
.sw.on::after{inset-inline-start:21px}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.grid-form>*{min-width:0}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.qr{background:#fff;color:#222;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.qr svg{width:100%;height:auto;display:block}
.qr b{display:block;font-family:var(--display);margin-top:6px}
.qr small{display:block;font-size:11px;color:#666;word-break:break-all}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{font-size:12.5px;color:var(--muted);display:block}
.kpi b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12.5px;margin-inline-start:6px}
.up{color:var(--ok)} .down{color:var(--bad)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.rgrid{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}
.hbar .tr{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hbar .fi{height:100%;background:var(--matcha);border-radius:6px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vchart{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:10px;border-bottom:1px solid var(--line)}
.vchart div{flex:1;background:var(--matcha);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.vchart div.pk{background:var(--honey)}
.vlab{display:flex;gap:3px;font-size:10.5px;color:var(--muted);margin-top:4px}
.vlab span{flex:1;text-align:center;overflow:hidden}
.demo-note{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-note p{margin:0;flex:1;min-width:220px}
.loglist{max-height:420px;overflow:auto;font-size:13.5px}
.loglist div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.loglist time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
</style>

function seedMenu(){
  const cats=[],products=[];
  CATS0.forEach(c=>{
    cats.push({id:c.id,ar:c.ar,en:c.en,st:c.st,ic:c.ic,h:c.h,on:true});
    c.items.trim().split("\n").forEach((ln,i)=>{
      const [ar,en,price,flags=""]=ln.split("|");const f=flags.split(" ").filter(Boolean);
      const g=[...c.g];
      if(f.includes("m")&&!g.includes("milk"))g.push("milk");
      if(f.includes("i")&&!g.includes("ice"))g.splice(1,0,"ice");
      if(f.includes("t")&&!g.includes("temp"))g.splice(1,0,"temp");
      f.filter(x=>x.startsWith("g:")).forEach(x=>g.push(x.slice(2)));
      const off=f.find(x=>/^o\d+/.test(x));
      products.push({id:c.id+"-"+(i+1),cat:c.id,ar,en,price:+price,offer:off?+off.slice(1):0,
        dAr:c.d[0],dEn:c.d[1],ing:"",best:f.includes("b"),isNew:f.includes("n"),on:true,from:"",to:"",img:"",g});
    });
  });
  return {cats,products};
}

/* ---------- demo orders for reports ---------- */
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function demoOrders(st){
  const R=rng(42),orders=[],now=Date.now(),day=864e5;
  const pool=st.products.flatMap(p=>Array(p.best?6:1).fill(p));
  const hourW=[8,1,9,1,10,2,11,3,12,4,13,5,14,5,15,5,16,6,17,8,18,10,19,12,20,14,21,14,22,12,23,9,0,5,1,2];
  const hours=[];for(let i=0;i<hourW.length;i+=2)for(let k=0;k<hourW[i+1];k++)hours.push(hourW[i]);
  let no=1001;
  for(let d=29;d>=0;d--){
    const base=new Date(now-d*day);base.setHours(0,0,0,0);
    const dow=base.getDay(),n=8+Math.floor(R()*7)+((dow===4||dow===5)?6:0);
    for(let k=0;k<n;k++){
      const h=hours[Math.floor(R()*hours.length)];
      let ts=base.getTime()+h*36e5+Math.floor(R()*60)*6e4;if(h<3)ts+=day;
      if(ts>now-20*6e4)continue;
      const cnt=1+Math.floor(R()*3),items=[];
      for(let j=0;j<cnt;j++){const p=pool[Math.floor(R()*pool.length)];const sel=defaultsFor(p,st);
        if(p.g.includes("extras")&&R()<.25)sel.extras=[Math.floor(R()*3)];
        items.push(buildLine(p,sel,R()<.2?2:1,"",st));}
      const tr=R(),type=tr<.62?"dine":tr<.84?"takeaway":"delivery";
      const cp=R()<.07?"MATCHA10":"";
      const t=totals(items,type,cp,st);
      const cancelled=R()<.05;
      const prepMin=4+Math.floor(R()*9);
      orders.push({id:uid(),no:no++,branch:"main",demo:true,type,table:type==="dine"?String(1+Math.floor(R()*12)):"",addr:type==="delivery"?"عنوان تجريبي":"",name:"",phone:"",
        items,...t,coupon:t.disc?cp:"",pay:R()<.85?"cash":"card",paid:!cancelled,refunded:cancelled&&R()<.5,status:cancelled?"cancelled":"done",
        created:ts,sched:0,times:{new:ts,prep:ts+60e3,ready:ts+(1+prepMin)*6e4,done:ts+(3+prepMin)*6e4},urgent:false,
        rating:cancelled?0:(R()<.55?(R()<.8?5:4):0),comment:"",src:R()<.3?"instagram":R()<.5?"qr":""});
    }
  }
  st.set.seq=no;
  st.stats.visits=Math.round(orders.length*3.4);
  st.stats.bySrc={qr:Math.round(orders.length*1.9),instagram:Math.round(orders.length*.9),direct:Math.round(orders.length*.6)};
  const live=[[3,"new"],[8,"prep"],[13,"ready"]];
  const pick=["matcha-2","pancake-2","coffee-12","dessert-8","ice-10","crepe-5"];
  live.forEach(([m,s],i)=>{
    const ps=[pick[i*2],pick[i*2+1]].map(id=>st.products.find(p=>p.id===id));
    const items=ps.map(p=>buildLine(p,defaultsFor(p,st),1,i===0&&p.cat==="matcha"?"سكر خفيف جدًا من فضلك":"",st));
    const ts=now-m*6e4,t=totals(items,"dine","",st);
    const times={new:ts};if(s!=="new")times.prep=ts+6e4;if(s==="ready")times.ready=ts+9*6e4;
    st.orders.push({id:uid(),no:st.set.seq++,branch:"main",demo:true,type:"dine",table:String(3+i*2),addr:"",name:"",phone:"",items,...t,coupon:"",pay:"cash",paid:false,refunded:false,status:s,created:ts,sched:0,times,urgent:false,rating:0,comment:"",src:"qr"});
  });
  st.orders.unshift(...orders);
  st.service.push({id:uid(),table:"7",kind:"waiter",t:now-2*6e4,done:false,demo:true});
}

/* ---------- pricing ---------- */
const catOf=p=>S.cats.find(c=>c.id===p.cat)||{};
const unitPrice=p=>p.offer&&p.offer<p.price?p.offer:p.price;
function inWindow(p){if(!p.from||!p.to)return true;const d=new Date(),m=d.getHours()*60+d.getMinutes();const[a,b]=[p.from,p.to].map(x=>{const[h,mm]=x.split(":").map(Number);return h*60+mm});return a<=b?(m>=a&&m<b):(m>=a||m<b)}
const avail=p=>p.on&&catOf(p).on!==false&&inWindow(p);
function defaultsFor(p,st=S){const s={};p.g.forEach(gid=>{const g=st.groups[gid];if(!g)return;if(g.multi)s[gid]=[];else if(g.def!=null)s[gid]=g.def});return s}
function buildLine(p,sel,qty,note,st=S){
  const opts=[];let add=0;
  p.g.forEach(gid=>{const g=st.groups[gid];if(!g)return;const v=sel[gid];const idx=g.multi?(v||[]):(v==null?[]:[v]);
    idx.forEach(i=>{const o=g.opts[i];if(o){opts.push({ar:o[0],en:o[1],price:+o[2]||0});add+=+o[2]||0}})});
  const c=st.cats.find(c=>c.id===p.cat)||{};
  return {key:p.id+"|"+JSON.stringify(sel)+"|"+note,pid:p.id,ar:p.ar,en:p.en,qty,unit:unitPrice(p)+add,opts,note:note||"",st:c.st||"bar",sel};
}
function totals(lines,type,code,st=S){
  const sub=lines.reduce((a,l)=>a+l.unit*l.qty,0);
  let disc=0,cpErr="";const cp=code?st.coupons.find(c=>c.on&&c.code.toUpperCase()===code.trim().toUpperCase()):null;
  if(code&&!cp)cpErr="bad";
  else if(cp){if(cp.min&&sub<cp.min)cpErr="min";else disc=cp.type==="pct"?sub*cp.val/100:Math.min(cp.val,sub)}
  const fee=type==="delivery"?st.set.fee:0;
  const svc=type==="dine"?(sub-disc)*st.set.service/100:0;
  const tax=(sub-disc+svc)*st.set.tax/100;
  return {sub:r2(sub),disc:r2(disc),fee,svc:r2(svc),tax:r2(tax),total:r2(sub-disc+fee+svc+tax),cpErr,cpMin:cp?cp.min:0};
}

function copy(text,msg){const done=()=>toast(msg||"اتنسخ");try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}

let actx;
function beep(){if(!ui.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  [0,.2,.4].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=[784,988,1175][i];o.connect(g);g.connect(actx.destination);
  const s=actx.currentTime+d;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.18);o.start(s);o.stop(s+.2)})}catch(e){}}

function placeOrder(){

  if(co.type==="dine"&&!ui.table)co.err=t("tableErr");
  else if(co.type==="delivery"&&(!co.addr.trim()||co.phone.replace(/\D/g,"").length<8))co.err=t("addrErr");
  else if(co.type==="delivery"&&tt.sub-tt.disc<S.set.min)co.err=`${t("minErr")} ${money(S.set.min)}`;
  else if(co.when==="later"&&!co.time)co.err=t("timeErr");
  if(co.err){renderSheet();return}
  let sched=0;if(co.when==="later"){const[h,m]=co.time.split(":").map(Number);const d=new Date();d.setHours(h,m,0,0);if(d<Date.now())d.setDate(d.getDate()+1);sched=d.getTime()}
  const now=Date.now();
  const o={id:uid(),no:S.set.seq++,branch:"main",type:co.type,table:co.type==="dine"?ui.table:"",addr:co.type==="delivery"?co.addr.trim():"",name:co.name.trim(),phone:co.phone.trim(),
    items:ui.cart.map(l=>({...l})),sub:tt.sub,disc:tt.disc,fee:tt.fee,svc:tt.svc,tax:tt.tax,total:tt.total,coupon:tt.disc?co.coupon.toUpperCase():"",pay:co.pay,paid:false,refunded:false,
    status:"new",created:now,sched,times:{new:now},urgent:false,rating:0,comment:"",src:ui.consent?ui.src:"",lang:L()};
  S.orders.push(o);
  if(o.phone){const c=S.customers[o.phone]||{name:o.name,points:0,orders:0,offers:false};c.name=o.name||c.name;c.orders++;c.points+=Math.floor(o.total/10);c.offers=co.offers;S.customers[o.phone]=c}

}

const typeAr=o=>o.type==="dine"?`ترابيزة ${o.table}`:o.type==="delivery"?"دليفري":"تيك أواي";
const stAr={new:"جديد",prep:"قيد التحضير",ready:"جاهز",done:"مسلّم",cancelled:"ملغي"};
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
function sortOrders(a,b){return (b.urgent-a.urgent)||((a.sched||a.created)-(b.sched||b.created))}
function vService(){const open=S.service.filter(s=>!s.done);if(!open.length)return"";
  return `<div class="svc">${open.map(s=>`<div class="item">${ic(s.kind==="bill"?"bill":"bell")}<span><b>ترابيزة ${esc(s.table)}</b> · ${s.kind==="bill"?"طلب الحساب":"بتنادي الجرسون"} · <span class="num" data-since="${s.t}"></span></span><button class="btn sm" data-act="svcDone" data-id="${s.id}">تم</button></div>`).join("")}</div>`}
function kCard(o){
  const items=o.items.map(l=>{const dim=ui.kst!=="all"&&l.st!==ui.kst;return `<li class="${dim?"dim":""}"><span class="q num">${l.qty}×</span>${esc(l.ar)}<span class="st-tag">${l.st==="bar"?"بار":"مطبخ"}</span>${l.opts.length?`<span class="o">${l.opts.map(x=>esc(x.ar)).join(" · ")}</span>`:""}${l.note?`<span class="n">ملاحظة: ${esc(l.note)}</span>`:""}</li>`}).join("");
  const next={new:["prep","ابدأ التحضير"],prep:["ready","جاهز"],ready:["done","تم التسليم"]}[o.status];
  return `<div class="kcard ${ui.fresh.has(o.id)?"fresh":""}" data-age="${o.created}">
   <div class="k-top"><span class="k-no num">#${o.no}</span><span class="k-time" data-since="${o.status==="prep"&&o.times.prep?o.times.prep:o.created}"></span></div>
   <div class="k-meta"><span>${typeAr(o)}</span>${o.urgent?`<span class="st st-new">عاجل</span>`:""}${o.sched&&o.sched>Date.now()?`<span class="st st-prep">مجدول ${new Date(o.sched).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}</span>`:""}${o.status==="prep"?`<span>وقت التحضير</span>`:""}</div>
   <ul class="k-items">${items}</ul>
   <div class="k-act">${next?`<button class="btn pri" data-act="adv" data-id="${o.id}" data-v="${next[0]}">${next[1]}</button>`:""}<button class="btn sm" data-act="ticket" data-id="${o.id}">تذكرة</button></div></div>`;
}
function vKitchen(){
  const live=S.orders.filter(o=>["new","prep","ready"].includes(o.status)&&(ui.kst==="all"||o.items.some(l=>l.st===ui.kst))).sort(sortOrders);
  const cols=[["new","جديد"],["prep","قيد التحضير"],["ready","جاهز للتسليم"]];
  const today=S.orders.filter(o=>o.status==="done"&&o.times.done>new Date().setHours(0,0,0,0)).length;

   <div class="seg" style="min-width:240px">${[["all","الكل"],["bar","البار"],["kitchen","المطبخ"]].map(([k,l])=>`<button data-act="kst" data-v="${k}" class="${ui.kst===k?"on":""}">${l}</button>`).join("")}</div>

   <p class="note">الطلبات بتظهر هنا لوحدها من غير تحديث. افتح المنيو في تاب تاني وابعت طلب علشان تشوف ده بيحصل.</p></div>`;

/* ---------- staff: cashier ---------- */
function vCashier(){
  const start=new Date().setHours(0,0,0,0);
  let os=S.orders.filter(o=>o.created>=start||["new","prep","ready"].includes(o.status));
  if(ui.cashTab==="open")os=os.filter(o=>!["done","cancelled"].includes(o.status)||(!o.paid&&o.status==="done"));
  os=os.sort((a,b)=>b.created-a.created);
  const unpaid=S.orders.filter(o=>o.status==="done"&&!o.paid).reduce((a,o)=>a+o.total,0);
  return `<div class="staff" dir="rtl"><div class="st-head"><h1>الكاشير</h1>
   <div class="seg" style="min-width:240px"><button data-act="cashTab" data-v="open" class="${ui.cashTab==="open"?"on":""}">المفتوحة</button><button data-act="cashTab" data-v="today" class="${ui.cashTab==="today"?"on":""}">كل طلبات النهارده</button></div>
   <span class="sp"></span><label class="chk" style="margin:0"><input type="checkbox" data-act="accepting" ${S.set.accepting?"checked":""}> استقبال الطلبات</label></div>
   ${vService()}
   ${unpaid?`<div class="demo-note"><p>فيه طلبات اتسلّمت ولسه ما اتحصّلتش بإجمالي <b class="num">${moneyA(unpaid)}</b>.</p></div>`:""}
   <div class="tablewrap"><table><thead><tr><th>الطلب</th><th>الوقت</th><th>النوع</th><th>الأصناف</th><th>الإجمالي</th><th>الدفع</th><th>الحالة</th><th></th></tr></thead><tbody>
   ${os.map(o=>`<tr><td class="num"><b>#${o.no}</b>${o.urgent?` <span class="st st-new">عاجل</span>`:""}</td><td class="num">${new Date(o.created).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}</td>
    <td>${typeAr(o)}${o.addr?`<div class="note" style="margin:0;white-space:normal;max-width:180px">${esc(o.addr)} · <span class="num">${esc(o.phone)}</span></div>`:""}</td>
    <td style="white-space:normal;min-width:180px">${o.items.map(l=>`${l.qty}× ${esc(l.ar)}`).join("، ")}</td>
    <td class="num"><b>${moneyA(o.total)}</b>${o.disc?`<div class="note" style="margin:0">خصم ${o.disc} (${esc(o.coupon)})</div>`:""}</td>
    <td>${o.refunded?`<span class="st st-cancelled" style="text-decoration:none">اترجع</span>`:o.paid?`<span class="st st-ready">اتحصّل</span>`:`<span class="st st-prep">${o.pay==="cash"?"كاش":"فيزا"} · لسه</span>`}</td>
    <td><select data-act="setStatus" data-id="${o.id}">${Object.entries(stAr).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v}</option>`).join("")}</select></td>
    <td><div style="display:flex;gap:4px">${!o.paid&&o.status!=="cancelled"?`<button class="btn sm pri" data-act="paid" data-id="${o.id}">تحصيل</button>`:""}
     ${o.status==="cancelled"&&o.paid&&!o.refunded?`<button class="btn sm danger" data-act="refund" data-id="${o.id}">استرداد</button>`:""}
     ${!["done","cancelled"].includes(o.status)?`<button class="btn sm" data-act="urgent" data-id="${o.id}">${o.urgent?"عادي":"عاجل"}</button>`:""}
     <button class="btn sm" data-act="ticket" data-id="${o.id}">تذكرة</button></div></td></tr>`).join("")||`<tr><td colspan="8" class="note">مفيش طلبات</td></tr>`}
   </tbody></table></div></div>`;
}
function ticketText(o){
  const w=32,ln="-".repeat(w);
  return `${S.brand.ar} | ${S.brand.en}\n${ln}\nطلب #${o.no}   ${new Date(o.created).toLocaleString("ar-EG",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric"})}\n${typeAr(o)}${o.addr?"\n"+o.addr:""}${o.phone?"\n"+o.phone:""}\n${ln}\n`+
  o.items.map(l=>`${l.qty} × ${l.ar}   ${l.unit*l.qty}${l.opts.length?"\n   - "+l.opts.map(x=>x.ar+(x.price?" +"+x.price:"")).join("\n   - "):""}${l.note?"\n   * "+l.note:""}`).join("\n")+
  `\n${ln}\nالمجموع: ${o.sub}${o.disc?"\nالخصم: -"+o.disc:""}${o.fee?"\nالتوصيل: "+o.fee:""}${o.svc?"\nالخدمة: "+o.svc:""}${o.tax?"\nالضريبة: "+o.tax:""}\nالإجمالي: ${o.total} ج.م\n${ln}\n${S.brand.phone}`;
}

   <div class="kpis">

    <div class="kpi"><span>عدد الطلبات</span><b>${cnt}</b>${chg(cnt,pcnt)}</div>

function csvFor(){
  const start=ui.range===1?new Date().setHours(0,0,0,0):new Date(Date.now()-(ui.range-1)*864e5).setHours(0,0,0,0);
  const rows=[["order_no","date","time","type","table","items","subtotal","discount","coupon","delivery_fee","service","tax","total","payment","paid","status","rating"]];
  S.orders.filter(o=>o.created>=start).forEach(o=>{const d=new Date(o.created);rows.push([o.no,d.toISOString().slice(0,10),d.toTimeString().slice(0,5),o.type,o.table,o.items.map(l=>l.qty+"x "+l.en).join("; "),o.sub,o.disc,o.coupon,o.fee,o.svc,o.tax,o.total,o.pay,o.paid?"yes":"no",o.status,o.rating||""])});
  return rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
}

function renderSheet(){
  const w=$("#sheet");if(!ui.sheet){w.hidden=true;w.innerHTML="";document.body.classList.remove("lock");return}
  const k=ui.sheet.kind;let body="",wide=false,dir=L()==="ar"?"rtl":"ltr";
  if(k==="product")body=vProduct();else if(k==="cart")body=vCart();else if(k==="track")body=vTrack();

  w.hidden=false;document.body.classList.add("lock");
  const sc=w.querySelector(".sheet")?.scrollTop||0;
  w.innerHTML=`<div class="scrim" data-act="closeSheet"></div><div class="sheet ${wide?"wide":""}" role="dialog" aria-modal="true" dir="${dir}">${body}</div>`;
  w.querySelector(".sheet").scrollTop=sc;
  if(k==="copy"){const b=$("#copyBox");b.focus();b.select()}
}

/* ---------- render ---------- */
function render(){
  applyBrand();
  $("#demo").innerHTML=vDemo();
  const v=ui.view;
  $("#app").innerHTML=v==="menu"?vMenu():v==="kitchen"?vKitchen():v==="cashier"?vCashier():v==="admin"?vAdmin():vReports();
  tick();
}
function renderList(){$("#list").innerHTML=vList();$("#chips").innerHTML=vChips()}
function tick(){
  document.querySelectorAll("[data-since]").forEach(el=>{el.textContent=mmss(Date.now()-+el.dataset.since)});
  document.querySelectorAll(".kcard[data-age]").forEach(el=>{const m=(Date.now()-+el.dataset.age)/6e4;el.classList.toggle("late",m>10&&m<=20);el.classList.toggle("very",m>20)});
}
setInterval(tick,1000);

/* sync between tabs (customer tab → kitchen tab) */
function syncFromStorage(){
  let raw;try{raw=localStorage.getItem(KEY)}catch(e){return}
  if(!raw||raw===lastRaw)return;lastRaw=raw;
  try{S=JSON.parse(raw)}catch(e){return}
  checkNew();
  const typing=document.activeElement&&["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
  if(!typing){render();if(ui.sheet&&["track","cart"].includes(ui.sheet.kind))renderSheet()}
}
window.addEventListener("storage",e=>{if(e.key===KEY)syncFromStorage()});
setInterval(syncFromStorage,3000);

/* ---------- path editing ---------- */
function setPath(path,val){const ks=path.split(".");let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function getPath(path){return path.split(".").reduce((o,k)=>o?.[k],S)}
async function shrink(file,max=600){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="userSel"){ui.user=el.value;const u=S.staff.find(s=>s.id===ui.user);if(ui.view!=="menu"&&!(PERMS[u.role]||[]).includes(ui.view))ui.view=PERMS[u.role][0]||"menu";render();return}
  if(el.dataset.edit){const old=getPath(el.dataset.edit);let v=el.value;if(el.dataset.num!==undefined||typeof old==="number")v=+v||0;setPath(el.dataset.edit,v);log(`غيّر ${el.dataset.edit.replace(/\.\d+\./g," ")}: ${old} ← ${v}`);save();
    if(ui.adminTab==="tables"||el.dataset.edit.startsWith("brand"))render();return}
  if(el.dataset.editb){setPath(el.dataset.editb,el.checked);log(`${el.checked?"فعّل":"وقّف"} ${el.dataset.editb}`);save();return}
  if(el.dataset.act==="setStatus"){const o=S.orders.find(x=>x.id===el.dataset.id);o.status=el.value;o.times[el.value]=Date.now();log(`طلب #${o.no}: الحالة ← ${stAr[el.value]}`);save();render();return}
  if(el.dataset.act==="accepting"){S.set.accepting=el.checked;log(el.checked?"فتح استقبال الطلبات":"وقف استقبال الطلبات");save();return}
  if(el.dataset.act==="pay"){ui.co.pay=el.value;return}
  if(el.dataset.act==="gdef"){S.groups[el.dataset.g].def=+el.dataset.i;save();return}
  if(el.dataset.co==="table"){ui.table=el.value;renderSheet();return}
  if(el.dataset.co==="offers"){ui.co.offers=el.checked;return}
  if(el.id==="e_img"&&el.files[0]){try{ui.sheet.p.img=await shrink(el.files[0]);renderSheet()}catch(err){toast("الصورة دي مش مدعومة")}return}
  if(el.id==="b_logo"&&el.files[0]){try{S.brand.logo=await shrink(el.files[0],300);log("غيّر اللوجو");save();render()}catch(err){toast("الصورة دي مش مدعومة")}return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){ui.q=el.value;renderList();return}
  if(el.dataset.pnote!==undefined&&ui.sheet){ui.sheet.note=el.value;return}
  if(el.dataset.co&&el.dataset.co!=="table"&&el.dataset.co!=="offers"){ui.co[el.dataset.co]=el.value;return}
  if(el.dataset.rc){const o=S.orders.find(x=>x.id===el.dataset.rc);o.comment=el.value;save()}
});

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.tagName==="SELECT"||(b.tagName==="INPUT"&&b.type!=="checkbox"&&b.type!=="radio"))return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  const P=()=>S.products.find(p=>p.id===id);
  switch(a){
  case"view":ui.view=v;closeSheet();render();window.scrollTo(0,0);break;
  case"lang":ui.lang=L()==="ar"?"en":"ar";lset("lang",ui.lang);render();break;
  case"cat":ui.cat=v;renderList();document.getElementById("chips").querySelector(".on")?.scrollIntoView({inline:"center",block:"nearest"});break;
  case"fav":{const i=ui.favs.indexOf(id);i<0?ui.favs.push(id):ui.favs.splice(i,1);lset("favs",ui.favs);renderList();break}
  case"open":{const p=P();openSheet("product",{id,sel:defaultsFor(p),qty:1,note:"",err:""});break}
  case"quick":{const p=P();const sel=defaultsFor(p);if(missingReq(p,sel).length){openSheet("product",{id,sel,qty:1,note:"",err:""})}else{addToCart(p,sel,1,"");render()}break}
  case"opt":{const g=S.groups[b.dataset.g],i=+b.dataset.i,s=ui.sheet.sel;if(g.multi){s[b.dataset.g]=s[b.dataset.g]||[];const k=s[b.dataset.g].indexOf(i);k<0?s[b.dataset.g].push(i):s[b.dataset.g].splice(k,1)}else s[b.dataset.g]=(!g.req&&s[b.dataset.g]===i)?null:i;ui.sheet.err="";renderSheet();break}
  case"pq":ui.sheet.qty=Math.max(1,ui.sheet.qty+ +b.dataset.d);renderSheet();break;
  case"addLine":{const s=ui.sheet,p=S.products.find(x=>x.id===s.id);const miss=missingReq(p,s.sel);if(miss.length){s.err=`${t("pickErr")}: ${miss.map(g=>nm(S.groups[g])).join("، ")}`;renderSheet();break}
    addToCart(p,s.sel,s.qty,s.note);closeSheet();render();break}
  case"cart":openSheet("cart",{});break;
  case"cq":{const l=ui.cart[+b.dataset.i];l.qty+=+b.dataset.d;if(l.qty<1)ui.cart.splice(+b.dataset.i,1);saveCart();renderSheet();render();break}
  case"otype":ui.co.type=v;ui.co.err="";renderSheet();break;
  case"when":ui.co.when=v;renderSheet();break;
  case"coupon":ui.co.coupon=(ui.co.couponDraft??"").trim();renderSheet();break;
  case"send":placeOrder();break;
  case"track":openSheet("track",{id});break;
  case"custCancel":{const o=S.orders.find(x=>x.id===id);if(o.status==="new"){o.status="cancelled";o.times.cancelled=Date.now();log(`العميل ألغى طلب #${o.no}`);save()}renderSheet();render();break}
  case"rate":{const o=S.orders.find(x=>x.id===id);o.rating=+v;save();renderSheet();break}
  case"svc":{S.service.push({id:uid(),table:ui.table,kind:v,t:Date.now(),done:false});save();checkNew();toast(t("reqSent"));break}
  case"shareMenu":copy(menuUrl()+(ui.table?"":"#src_qr"),t("copied"));break;
  case"shareP":copy(menuUrl()+"#p-"+id,t("copied"));break;
  case"consent":ui.consent=v==="1";lset("consent",ui.consent);if(ui.consent&&ui.src){S.stats.bySrc[ui.src]=(S.stats.bySrc[ui.src]||0)+1;save()}render();break;
  case"closeSheet":closeSheet();break;
  /* kitchen & cashier */
  case"kst":ui.kst=v;render();break;
  case"sound":ui.sound=!ui.sound;if(ui.sound)beep();render();break;
  case"adv":{const o=S.orders.find(x=>x.id===id);o.status=v;o.times[v]=Date.now();ui.fresh.delete(id);log(`طلب #${o.no}: ${stAr[v]}`);save();render();break}
  case"ticket":openSheet("ticket",{id});break;
  case"copyTicket":copy(ticketText(S.orders.find(x=>x.id===ui.sheet.id)),"اتنسخت التذكرة");break;
  case"svcDone":{const s=S.service.find(x=>x.id===id);s.done=true;save();render();break}
  case"cashTab":ui.cashTab=v;render();break;
  case"paid":{const o=S.orders.find(x=>x.id===id);o.paid=true;log(`حصّل طلب #${o.no} (${o.total} ج.م)`);save();render();break}
  case"refund":{const o=S.orders.find(x=>x.id===id);o.refunded=true;log(`استرد ${o.total} ج.م لطلب #${o.no}`);save();render();break}
  case"urgent":{const o=S.orders.find(x=>x.id===id);o.urgent=!o.urgent;save();render();break}
  /* admin */
  case"atab":ui.adminTab=v;render();break;
  case"pOn":{const p=P();p.on=!p.on;log(`${p.on?"شغّل":"وقّف"} ${p.ar}`);save();render();break}
  case"catOn":{const c=S.cats[+b.dataset.i];c.on=c.on===false;log(`${c.on?"شغّل":"وقّف"} قسم ${c.ar}`);save();render();break}
  case"catMove":{const i=+b.dataset.i,j=i+ +b.dataset.d;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];log(`غيّر ترتيب قسم ${S.cats[j].ar}`);save();render();break}
  case"addCat":{const id2="cat"+uid();S.cats.push({id:id2,ar:"قسم جديد",en:"New category",st:"bar",ic:"cup",h:60,on:true});log("أضاف قسم جديد");save();render();break}
  case"editP":{const p=id?JSON.parse(JSON.stringify(P())):{id:"",cat:b.dataset.cat,ar:"",en:"",price:0,offer:0,dAr:"",dEn:"",ing:"",best:false,isNew:true,on:true,from:"",to:"",img:"",g:[]};openSheet("editP",{p,isNew:!id});break}
  case"rmImg":ui.sheet.p.img="";renderSheet();break;
  case"saveP":{const p=ui.sheet.p,g=id=>$("#"+id);
    const np={...p,ar:g("e_ar").value.trim(),en:g("e_en").value.trim(),cat:g("e_cat").value,price:+g("e_price").value||0,offer:+g("e_offer").value||0,from:g("e_from").value,to:g("e_to").value,
      dAr:g("e_dar").value,dEn:g("e_den").value,ing:g("e_ing").value,on:g("e_on").checked,best:g("e_best").checked,isNew:g("e_new").checked,g:[...document.querySelectorAll("[data-eg]")].filter(x=>x.checked).map(x=>x.dataset.eg)};
    if(!np.ar){toast("اكتب اسم المنتج بالعربي");break}
    if(ui.sheet.isNew){np.id=np.cat+"-"+uid();S.products.push(np);log(`أضاف منتج ${np.ar} بسعر ${np.price}`)}
    else{const i=S.products.findIndex(x=>x.id===p.id),old=S.products[i];if(old.price!==np.price)log(`سعر ${np.ar}: ${old.price} ← ${np.price}`);if((old.offer||0)!==np.offer)log(`عرض ${np.ar}: ${old.offer||"—"} ← ${np.offer||"—"}`);log(`عدّل منتج ${np.ar}`);S.products[i]=np}
    save();closeSheet();render();toast("اتحفظ");break}
  case"delP":{if(!ui.sheet.confirmDel){ui.sheet.confirmDel=true;renderSheet();break}const p=ui.sheet.p;S.products=S.products.filter(x=>x.id!==p.id);log(`حذف منتج ${p.ar}`);save();closeSheet();render();break}
  case"gadd":S.groups[b.dataset.g].opts.push(["اختيار جديد","New option",0]);save();render();break;
  case"gdel":{const g=S.groups[b.dataset.g];g.opts.splice(+b.dataset.i,1);if(g.def!=null&&g.def>=g.opts.length)g.def=null;log(`حذف اختيار من ${g.ar}`);save();render();break}
  case"gnew":{const n=$("#ng_ar").value.trim();if(!n)break;S.groups["g"+uid()]={ar:n,en:n,req:0,multi:0,def:null,opts:[]};log(`أضاف مجموعة ${n}`);save();render();break}
  case"cpOn":{const c=S.coupons[+b.dataset.i];c.on=!c.on;log(`${c.on?"فعّل":"وقّف"} كوبون ${c.code}`);save();render();break}
  case"cpDel":{const c=S.coupons.splice(+b.dataset.i,1)[0];log(`حذف كوبون ${c.code}`);save();render();break}
  case"cpAdd":{const c=$("#ncp").value.trim().toUpperCase();if(!c||S.coupons.some(x=>x.code===c)){toast("اكتب كود جديد مش متكرر");break}S.coupons.push({code:c,type:"pct",val:10,min:0,on:true});log(`أضاف كوبون ${c}`);save();render();break}
  case"addBranch":S.branches.push({id:"b"+uid(),name:"فرع جديد"});log("أضاف فرع");save();render();break;
  case"stAdd":S.staff.push({id:"s"+uid(),name:"موظف جديد",role:"cashier"});log("أضاف موظف");save();render();break;
  case"stDel":{const s=S.staff.splice(+b.dataset.i,1)[0];log(`حذف الموظف ${s.name}`);save();render();break}
  case"resetColor":S.brand.color="";save();render();break;
  case"exportJson":copy(JSON.stringify(S),"اتنسخت النسخة الاحتياطية");break;
  case"importJson":{try{const n=JSON.parse($("#importBox").value);if(n.v!==1||!n.products)throw 0;S=n;log("استرجع نسخة احتياطية");save();render();toast("اترجعت النسخة")}catch(err){toast("النص ده مش نسخة احتياطية صحيحة")}break}
  case"clearDemo":if(!ui.confirmClear){ui.confirmClear=true;render();break}ui.confirmClear=false;S.orders=S.orders.filter(o=>!o.demo);S.service=S.service.filter(s=>!s.demo);S.stats={visits:0,bySrc:{}};log("مسح الطلبات التجريبية");save();render();toast("اتمسحت");break;
  case"resetAll":if(!ui.confirmReset){ui.confirmReset=true;render();break}ui.confirmReset=false;S=seed();save();ui.known=new Set(S.orders.map(o=>o.id));render();toast("رجعت للبداية");break;
  case"range":ui.range=+v;render();break;
  case"csv":openSheet("copy",{text:csvFor()});break;
  }
});

/* ---------- boot: read #t5 / #p-coffee-3 / #src_ig / #kitchen ---------- */
(function boot(){
  S=load();ui.known=new Set(S.orders.map(o=>o.id));S.service.forEach(x=>ui.known.add(x.id));
  const h=(location.hash||"").slice(1);
  let m;
  if(m=h.match(/^t(\d+)$/))ui.table=m[1];
  else if(m=h.match(/^src_(\w+)$/))ui.src=m[1];
  else if(["kitchen","cashier","admin","reports"].includes(h))ui.view=h;
  ui.co.type="";
  S.stats.visits=(S.stats.visits||0)+1;
  if(ui.consent&&ui.src){S.stats.bySrc[ui.src]=(S.stats.bySrc[ui.src]||0)+1}
  save();render();
  if(m=h.match(/^p-(.+)$/)){const p=S.products.find(x=>x.id===m[1]);if(p)openSheet("product",{id:p.id,sel:defaultsFor(p),qty:1,note:"",err:""})}
})();
</script>
